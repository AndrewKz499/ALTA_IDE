<!doctype html><html lang="ru" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../../assets/fonts/fonts.css"><link rel="stylesheet" href="../../tokens/tokens.css"><link rel="stylesheet" href="./context-menu.css"><title>Context Menu</title></head><body><div class="context-stage" tabindex="0">ПКМ здесь<div class="ds-context-menu" hidden role="menu"><button role="menuitem">Создать экран <kbd>Enter</kbd></button><button role="menuitem">Переименовать</button><hr><button role="menuitem">Удалить <kbd>Delete</kbd></button></div></div><script>var st=document.querySelector('.interactive .context-stage'),m=st&&st.querySelector('.ds-context-menu');if(st&&m){st.addEventListener('contextmenu',function(e){e.preventDefault();m.hidden=false;m.style.left=Math.min(e.offsetX,70)+'px';m.style.top=Math.min(e.offsetY,50)+'px'});document.addEventListener('click',function(e){if(!m.contains(e.target)&&e.target!==st)m.hidden=true});document.addEventListener('keydown',function(e){if(e.key==='Escape')m.hidden=true})}</script></body></html>
