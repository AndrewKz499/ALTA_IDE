<!doctype html><html lang="ru" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../../assets/fonts/fonts.css"><link rel="stylesheet" href="../../tokens/tokens.css"><link rel="stylesheet" href="./tabs.css"><title>Tabs</title></head><body><div class="ds-tabs" role="tablist"><button role="tab" aria-selected="true" data-panel="p1">Проект</button><button role="tab" aria-selected="false" data-panel="p2">Визуализация</button><button role="tab" aria-selected="false" data-panel="p3">Отладка</button></div><div class="tab-panel" id="p1">Содержимое «Проект»</div><div class="tab-panel" id="p2" hidden>Содержимое «Визуализация»</div><div class="tab-panel" id="p3" hidden>Содержимое «Отладка»</div><script>document.querySelectorAll('.interactive .ds-tabs button').forEach(function(b){b.addEventListener('click',function(){var tabs=b.parentNode.querySelectorAll('button');tabs.forEach(function(x){x.setAttribute('aria-selected',String(x===b))});document.querySelectorAll('.interactive .tab-panel').forEach(function(p){p.hidden=p.id!==b.dataset.panel})})});</script></body></html>
