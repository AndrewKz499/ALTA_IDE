<!doctype html><html lang="ru" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clipboard and Hints Preview</title><link rel="stylesheet" href="../../assets/fonts/fonts.css"><link rel="stylesheet" href="../../tokens/tokens.css"><link rel="stylesheet" href="./clipboard-and-hints.css"><style>*{box-sizing:border-box}body{margin:0;padding:24px;font-family:var(--font-family-rubik),sans-serif}html[data-theme=dark] body{background:var(--color-dark-gray-15);color:var(--color-dark-gray-4)}html[data-theme=light] body{background:var(--color-light-gray-1);color:var(--color-light-gray-12)}header{display:flex;justify-content:space-between;margin-bottom:28px}h1,h2{margin:0}.demo{display:flex;gap:16px;align-items:center;margin:16px 0 32px}.separator{border:0;border-top:1px solid currentColor;opacity:.5;margin:24px 0}.matrix{display:grid;grid-template-columns:150px max-content;gap:18px 24px}.row{text-align:right;opacity:.7}.target{padding:8px 12px}</style></head><body><header><div><h1>Clipboard and Hints</h1><small>Figma nodes 200252:19069 / 200283:4385</small></div><div><button data-t="light">Light</button><button data-t="dark">Dark</button></div></header><section><h2>Interactive component</h2><div class="demo"><button id="copy">Скопировать историю</button><span class="ds-clipboard" id="toast" role="status" hidden>История версий скопирована</span><button class="target" id="hint-target">Наведи курсор</button><span class="ds-hint" id="hint" role="tooltip" hidden>Fort (Система сборки и разборки)</span></div></section><hr class="separator"><section><h2>States matrix</h2><div class="matrix"><div class="row">Clipboard</div><span class="ds-clipboard">История версий скопирована</span><div class="row">Hints</div><span class="ds-hint">Fort (Система сборки и разборки)</span></div></section><script src="./clipboard-and-hints.js"></script><script>copy.onclick=()=>DSClipboardHint.show(toast);hintTarget=document.getElementById('hint-target');hintTarget.onmouseenter=()=>hint.hidden=false;hintTarget.onmouseleave=()=>hint.hidden=true;document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>document.documentElement.dataset.theme=b.dataset.t)</script></body></html>
