<!doctype html><html lang="ru" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../../assets/fonts/fonts.css"><link rel="stylesheet" href="../../tokens/tokens.css"><link rel="stylesheet" href="./bit-mask-picker.css"><title>Bit Mask Picker</title></head><body><div class="ds-bitmask" role="group" aria-label="Bit mask"><div class="ds-bitmask__bits"><button type="button" class="ds-bitmask__bit" aria-pressed="false">0</button><button type="button" class="ds-bitmask__bit" aria-pressed="false">1</button><button type="button" class="ds-bitmask__bit" aria-pressed="false">2</button><button type="button" class="ds-bitmask__bit" aria-pressed="false">3</button><button type="button" class="ds-bitmask__bit" aria-pressed="false">4</button><button type="button" class="ds-bitmask__bit" aria-pressed="false">5</button><button type="button" class="ds-bitmask__bit" aria-pressed="false">6</button><button type="button" class="ds-bitmask__bit" aria-pressed="false">7</button></div><output class="ds-bitmask__value">0</output></div><script>document.querySelectorAll('.ds-bitmask').forEach(function(root){var bits=[].slice.call(root.querySelectorAll('.ds-bitmask__bit'));var out=root.querySelector('.ds-bitmask__value');bits.forEach(function(b,i){b.addEventListener('click',function(){b.setAttribute('aria-pressed',String(b.getAttribute('aria-pressed')!=='true'));var v=0;bits.forEach(function(x,j){if(x.getAttribute('aria-pressed')==='true')v+=Math.pow(2,j)});if(out)out.textContent=v;})})});</script></body></html>
