<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inputs / Autocomplete — Demo</title>
    <link rel="stylesheet" href="../../tokens/tokens.css">
    <link rel="stylesheet" href="../input/input.css">
    <link rel="stylesheet" href="./autocomplete.css">
    <style>
      * { box-sizing: border-box; }

      body {
        margin: var(--num-28);
        background: var(--autocomplete-item-bg-default);
        color: var(--autocomplete-item-text-code-default);
        font-family: var(--font-family-rubik), sans-serif;
      }

      h1,
      h2,
      p { margin-top: 0; }

      h1,
      h2,
      .demo-card__title {
        font-size: var(--font-size-1);
        line-height: var(--line-height-0);
      }

      .demo-intro,
      .demo-card__title {
        color: var(--autocomplete-item-text-code-info);
      }

      .demo-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(427px, 1fr));
        gap: var(--num-20);
        margin-bottom: var(--num-28);
      }

      .demo-card {
        display: grid;
        align-content: start;
        gap: var(--num-8);
      }

      .demo-card--list {
        min-height: calc(var(--num-28) * 13);
      }

      .demo-hover .ds-input__control:not(:disabled):not([data-state="error"]) {
        border-color: var(--input-border-hover);
        background: var(--input-background-hover);
        color: var(--input-content-hover);
      }

      .demo-focus .ds-input__control:not(:disabled):not([data-state="error"]) {
        border-color: var(--input-border-focused);
        background: var(--input-background-focused);
        color: var(--input-content-focused);
      }
    </style>
  </head>
  <body>
    <h1>Inputs / Autocomplete</h1>
    <p class="demo-intro">Введите «my», затем используйте ↓, ↑, Enter и Escape. Клик вне списка закрывает его.</p>

    <section aria-labelledby="interactive-title">
      <h2 id="interactive-title">Интерактивный пример</h2>
      <div class="demo-grid">
        <div class="demo-card">
          <div class="demo-card__title">Реальный ввод</div>
          <div data-autocomplete-demo="interactive"></div>
        </div>
      </div>
    </section>

    <section aria-labelledby="field-states-title">
      <h2 id="field-states-title">Состояния поля</h2>
      <div class="demo-grid">
        <div class="demo-card"><div class="demo-card__title">Closed / Default</div><div data-autocomplete-demo="default"></div></div>
        <div class="demo-card"><div class="demo-card__title">Hover</div><div data-autocomplete-demo="hover"></div></div>
        <div class="demo-card"><div class="demo-card__title">Focus</div><div data-autocomplete-demo="focus"></div></div>
        <div class="demo-card"><div class="demo-card__title">Filled</div><div data-autocomplete-demo="filled"></div></div>
        <div class="demo-card"><div class="demo-card__title">Disabled</div><div data-autocomplete-demo="disabled"></div></div>
        <div class="demo-card"><div class="demo-card__title">Error</div><div data-autocomplete-demo="error"></div></div>
      </div>
    </section>

    <section aria-labelledby="list-states-title">
      <h2 id="list-states-title">Состояния списка</h2>
      <div class="demo-grid">
        <div class="demo-card demo-card--list"><div class="demo-card__title">Open</div><div data-autocomplete-demo="open"></div></div>
        <div class="demo-card demo-card--list"><div class="demo-card__title">Item Hover</div><div data-autocomplete-demo="item-hover"></div></div>
        <div class="demo-card demo-card--list"><div class="demo-card__title">Item Active</div><div data-autocomplete-demo="item-active"></div></div>
        <div class="demo-card demo-card--list"><div class="demo-card__title">Empty</div><div data-autocomplete-demo="empty"></div></div>
      </div>
    </section>

    <template id="autocomplete-demo-template">
      <div class="ds-autocomplete" data-open="false">
        <div class="ds-input">
          <label class="ds-input__label">Label</label>
          <div class="ds-autocomplete__anchor">
            <input
              class="ds-input__control ds-autocomplete__control"
              type="text"
              placeholder="Text"
              autocomplete="off"
              role="combobox"
              aria-autocomplete="list"
              aria-expanded="false"
            >
            <div class="ds-autocomplete__popup" role="listbox" hidden>
              <div class="ds-autocomplete__options"></div>
              <div class="ds-autocomplete__empty" role="status" hidden>Ничего не найдено</div>
              <div class="ds-autocomplete__footer" aria-hidden="true">
                <span>Enter — Вставить, Tab — заменить</span>
                <span class="ds-autocomplete__more"><img src="./assets/more.png" alt=""></span>
              </div>
            </div>
          </div>
          <p class="ds-input__hint">Hint text</p>
        </div>
      </div>
    </template>

    <script src="./autocomplete.js"></script>
    <script>
      var autocompleteDemoData = [
        "MyFun1",
        "MyFunction",
        "MyMultivariateDifferentiab",
        "MyVar",
        "Var My",
        "MyNT",
        "TestMyVar",
        "MyVariable",
        "DifferentiabMy",
        "Var MyTestVar"
      ];

      var autocompleteTemplate = document.querySelector("#autocomplete-demo-template");
      var autocompleteInstances = [];

      document.querySelectorAll("[data-autocomplete-demo]").forEach(function (mount, index) {
        var state = mount.dataset.autocompleteDemo;
        var fragment = autocompleteTemplate.content.cloneNode(true);
        var root = fragment.querySelector(".ds-autocomplete");
        var label = fragment.querySelector("label");
        var input = fragment.querySelector("input");
        var popup = fragment.querySelector(".ds-autocomplete__popup");
        var hint = fragment.querySelector(".ds-input__hint");
        var prefix = "demo-autocomplete-" + index;

        root.id = prefix;
        input.id = prefix + "-input";
        popup.id = prefix + "-listbox";
        hint.id = prefix + "-hint";
        label.htmlFor = input.id;
        input.setAttribute("aria-controls", popup.id);
        input.setAttribute("aria-describedby", hint.id);

        if (state === "hover") {
          root.classList.add("demo-hover");
        } else if (state === "focus") {
          root.classList.add("demo-focus");
          input.value = "My";
        } else if (state === "filled") {
          input.value = "MyVar";
        } else if (state === "disabled") {
          input.disabled = true;
        } else if (state === "error") {
          input.value = "Unknown";
          root.querySelector(".ds-input").dataset.invalid = "true";
          input.setAttribute("aria-invalid", "true");
        }

        mount.append(fragment);

        var instance = new DSAutocomplete(root, autocompleteDemoData);
        autocompleteInstances.push(instance);

        if (state === "open" || state === "item-hover" || state === "item-active") {
          input.value = "My";
          instance.open();
        } else if (state === "empty") {
          input.value = "ZZ";
          instance.open();
        }

        if (state === "item-hover") {
          root.querySelector(".ds-autocomplete__item").dataset.demoHover = "true";
        } else if (state === "item-active") {
          instance.setActive(0);
        }
      });
    </script>
  </body>
</html>
