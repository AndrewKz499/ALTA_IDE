<!doctype html><html lang="ru" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autocomplete Preview — AltaIDE DS</title><link rel="stylesheet" href="../../assets/fonts/fonts.css"><link rel="stylesheet" href="../../tokens/tokens.css"><link rel="stylesheet" href="./autocomplete.css"><style>*{box-sizing:border-box}body{margin:0;padding:24px;font-family:var(--font-family-rubik),sans-serif}html[data-theme=dark] body{background:var(--color-dark-gray-15);color:var(--color-dark-gray-4)}html[data-theme=light] body{background:var(--color-light-gray-1);color:var(--color-light-gray-12)}header{display:flex;justify-content:space-between;margin-bottom:28px}h1,h2{margin:0}.search{width:427px;margin:14px 0 8px;padding:7px 9px}.separator{border:0;border-top:1px solid currentColor;opacity:.5;margin:32px 0 24px}.matrix{display:grid;grid-template-columns:140px 427px;gap:14px 24px;align-items:center}.row{text-align:right;opacity:.7}.matrix .ds-autocomplete__item{pointer-events:none}.selected{margin-top:8px;font-size:12px;opacity:.8}</style></head><body><header><div><h1>Autocomplete</h1><small>AltaIDE/Autocomplete · Figma 202319:9697 · 427×308</small></div><div><button data-t="light">Light</button><button data-t="dark">Dark</button></div></header><section><h2>Interactive component</h2><input class="search" id="query" value="My" aria-label="Фильтр autocomplete"><div class="ds-autocomplete" id="live" data-interactive="true" role="listbox"><div class="ds-autocomplete__list" id="list"></div><div class="ds-autocomplete__info">Enter - Вставить, Tab - заменить</div></div><div class="selected" id="selected">Выберите элемент стрелками ↑/↓ и Enter.</div></section><hr class="separator"><section><h2>States matrix</h2><div class="matrix"><div class="row">Default · Stroke</div><button class="ds-autocomplete__item"><span class="ds-autocomplete__left"><span class="ds-autocomplete__icon"></span><span class="ds-autocomplete__code">MyFunction</span></span><span class="ds-autocomplete__type">DWORD</span></button><div class="row">Hover · Stroke</div><button class="ds-autocomplete__item" data-state="hover"><span class="ds-autocomplete__left"><span class="ds-autocomplete__icon"></span><span class="ds-autocomplete__code">MyFunction</span></span><span class="ds-autocomplete__type">DWORD</span></button><div class="row">Active · Stroke</div><button class="ds-autocomplete__item" data-state="active"><span class="ds-autocomplete__left"><span class="ds-autocomplete__icon"></span><span class="ds-autocomplete__code"><span class="ds-autocomplete__match">My</span>Function</span></span><span class="ds-autocomplete__type">DWORD</span></button><div class="row">Info · Menu</div><div class="ds-autocomplete__info">Enter - Вставить, Tab - заменить</div></div></section><script src="./autocomplete.js"></script><script>(function(){var data=['MyFun1','MyFunction','MyMultivariateDifferentiab','MyVar','VarMy','MyNT','TestMyVar','MyVariable','DifferentiabMy','VarMyTestVar'];var list=document.getElementById('list'),q=document.getElementById('query');function render(){var term=q.value.toLowerCase();list.innerHTML=data.filter(x=>x.toLowerCase().includes(term)).map(function(x){var i=x.toLowerCase().indexOf(term),a=i>=0?x.slice(0,i):x,b=i>=0?x.slice(i,i+term.length):'',c=i>=0?x.slice(i+term.length):x;return '<button class="ds-autocomplete__item" data-value="'+x+'"><span class="ds-autocomplete__left"><span class="ds-autocomplete__icon"></span><span class="ds-autocomplete__code">'+a+'<span class="ds-autocomplete__match">'+b+'</span>'+c+'</span><span class="ds-autocomplete__vars">(VAR1, VAR2)</span></span><span class="ds-autocomplete__type">DWORD</span></button>'}).join('');live.dataset.ready='';DSAutocomplete.init(document)}q.addEventListener('input',render);live.addEventListener('autocomplete-select',e=>selected.textContent='Выбрано: '+e.detail.value);render();document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>document.documentElement.dataset.theme=b.dataset.t)})();</script></body></html>
