<!doctype html><html lang="ru" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../../assets/fonts/fonts.css"><link rel="stylesheet" href="../../tokens/tokens.css"><link rel="stylesheet" href="./plc.css"><title>PLC</title></head><body><div class="ds-plc" data-status="unconnect"><div class="ds-plc__logo">PLC</div><div><b>СПК210</b><small class="ds-plc__status">Не подключен</small></div><button type="button">Подключить</button></div><script>var p=document.querySelector('.interactive .ds-plc'),b=p&&p.querySelector('button'),s=p&&p.querySelector('.ds-plc__status');if(b){b.addEventListener('click',function(){p.dataset.status='connecting';s.textContent='Подключение…';b.disabled=true;setTimeout(function(){p.dataset.status='success';s.textContent='Подключен';b.textContent='Отключить';b.disabled=false},700)})}</script></body></html>
