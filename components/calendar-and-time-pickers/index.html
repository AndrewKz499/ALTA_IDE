<!doctype html><html lang="ru" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../../assets/fonts/fonts.css"><link rel="stylesheet" href="../../tokens/tokens.css"><link rel="stylesheet" href="./calendar-and-time-pickers.css"><title>Calendar and Time Pickers</title></head><body><div class="ds-datetime"><label>Дата <input type="date" class="ds-datetime__input"></label><label>Время <input type="time" class="ds-datetime__input"></label><output class="ds-datetime__out">Выберите дату и время</output></div><script>var ds=document.querySelector('.ds-datetime');if(ds){var ins=ds.querySelectorAll('input'),out=ds.querySelector('.ds-datetime__out');ins.forEach(function(i){i.addEventListener('input',function(){out.textContent=(ins[0].value||'—')+' · '+(ins[1].value||'—')})})}</script></body></html>
