<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Button — AltaIDE DS</title>
  <link rel="stylesheet" href="../../assets/fonts/fonts.css" />
  <link rel="stylesheet" href="../../tokens/tokens.css" />
  <link rel="stylesheet" href="./button.css" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; font-family: var(--font-family-rubik), system-ui, sans-serif; }
    html[data-theme="dark"] body { background: var(--color-dark-gray-15); color: var(--color-dark-gray-7); }
    html[data-theme="light"] body { background: var(--color-light-gray-1); color: var(--color-light-gray-12); }
    .preview-head { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:24px; }
    h1 { margin:0; font-size:20px; }
    .theme-switch { display:inline-flex; gap:4px; padding:4px; border:1px solid currentColor; border-radius:6px; }
    .theme-switch button { font:inherit; padding:6px 10px; border:0; border-radius:4px; cursor:pointer; }
    html[data-theme="dark"] .theme-switch button { background:var(--color-dark-gray-13); color:var(--color-dark-white); }
    html[data-theme="light"] .theme-switch button { background:var(--color-light-gray-3); color:var(--color-light-gray-12); }
    .theme-switch button[aria-pressed="true"] { outline:2px solid currentColor; }
    .size-block { margin-bottom:32px; }
    .size-block h2 { font-size:14px; margin:0 0 12px; }
    .grid { display:grid; grid-template-columns:120px repeat(4, minmax(120px,1fr)); gap:12px 16px; align-items:center; overflow:auto; }
    .col-h,.row-h { font-size:11px; text-transform:uppercase; }
    .row-h { text-align:right; }
    .cell { display:flex; }
    .cell[data-force="hover"] .ds-button:not(:disabled):not([data-state="loading"]) { background:var(--buttons-primary-background-hover); }
    .cell[data-force="pressed"] .ds-button:not(:disabled):not([data-state="loading"]) { background:var(--buttons-primary-background-pressed); }
  </style>
</head>
<body>
  <header class="preview-head">
    <div><h1>Button</h1><div>Primary · все состояния и размеры</div></div>
    <div class="theme-switch" aria-label="Тема">
      <button type="button" data-set-theme="light" aria-pressed="false">Light</button>
      <button type="button" data-set-theme="dark" aria-pressed="true">Dark</button>
    </div>
  </header>
  <main id="root"></main>
  <script src="./button.js"></script>
  <script>
    (function () {
      var SIZES=[{k:"l",t:"Size L (14/20)"},{k:"m",t:"Size M (12/16)"}];
      var STATES=["default","hover","pressed","loading","disabled"];
      var ICONS=["none","left","right","only"];
      var ICON='<svg viewBox="0 0 16 16" width="16" height="16" fill="none" aria-hidden="true"><path d="M8 2.5v11M2.5 8h11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
      var SPINNER='<svg viewBox="0 0 16 16" width="16" height="16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.25" stroke="currentColor" stroke-width="1.75" opacity=".3"/><path d="M8 1.75A6.25 6.25 0 0 1 14.25 8" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>';
      function icon(){return '<span class="ds-button__icon" aria-hidden="true">'+ICON+'</span>';}
      function spinner(){return '<span class="ds-button__spinner" aria-hidden="true">'+SPINNER+'</span>';}
      function button(size,state,ic){
        var a=['class="ds-button"','type="button"','data-size="'+size+'"','data-icon="'+ic+'"'];
        if(state==="loading")a.push('data-state="loading"');
        if(state==="disabled")a.push('disabled');
        if(ic==="only")a.push('aria-label="Действие"');
        var inner=ic==="left"?icon()+'<span class="ds-button__label">Кнопка</span>':ic==="right"?'<span class="ds-button__label">Кнопка</span>'+icon():ic==="only"?icon():'<span class="ds-button__label">Кнопка</span>';
        return '<button '+a.join(' ')+'>'+inner+spinner()+'</button>';
      }
      var html='';
      SIZES.forEach(function(s){html+='<section class="size-block"><h2>'+s.t+'</h2><div class="grid"><div></div>';ICONS.forEach(function(i){html+='<div class="col-h">icon: '+i+'</div>';});STATES.forEach(function(st){html+='<div class="row-h">'+st+'</div>';ICONS.forEach(function(i){var f=(st==="hover"||st==="pressed")?' data-force="'+st+'"':'';html+='<div class="cell"'+f+'>'+button(s.k,st,i)+'</div>';});});html+='</div></section>';});
      var root=document.getElementById('root'); root.innerHTML=html; if(window.DSButton)window.DSButton.init(root);
      document.querySelectorAll('[data-set-theme]').forEach(function(btn){btn.addEventListener('click',function(){var theme=btn.getAttribute('data-set-theme');document.documentElement.dataset.theme=theme;document.querySelectorAll('[data-set-theme]').forEach(function(b){b.setAttribute('aria-pressed',String(b===btn));});});});
    })();
  </script>
</body>
</html>
