<!doctype html><html lang="ru" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Badge Preview</title><link rel="stylesheet" href="../../assets/fonts/fonts.css"><link rel="stylesheet" href="../../tokens/tokens.css"><link rel="stylesheet" href="./badge.css"><style>*{box-sizing:border-box}body{margin:0;padding:24px;font-family:var(--font-family-rubik),sans-serif}html[data-theme=dark] body{background:var(--color-dark-gray-15);color:var(--color-dark-gray-4)}html[data-theme=light] body{background:var(--color-light-gray-1);color:var(--color-light-gray-12)}header{display:flex;justify-content:space-between;margin-bottom:28px}h1,h2{margin:0}.interactive{display:flex;align-items:center;gap:18px;margin:16px 0 32px}.matrix{display:grid;grid-template-columns:140px max-content;gap:20px 24px;align-items:center}.row{text-align:right;opacity:.7}.separator{border:0;border-top:1px solid currentColor;opacity:.5;margin:24px 0}</style></head><body><header><div><h1>Badge</h1><small>AltaIDE/Badge · Figma 185215:20485</small></div><div><button data-t="light">Light</button><button data-t="dark">Dark</button></div></header><section><h2>Interactive component</h2><div class="interactive"><span class="ds-badge" id="live" data-state="counter">9</span><button id="minus">−</button><button id="plus">+</button><button data-state-btn="error">Error</button><button data-state-btn="info">Info</button><button data-state-btn="done">Done</button><button data-state-btn="counter">Counter</button></div></section><hr class="separator"><section><h2>States matrix</h2><div class="matrix"><div class="row">Error</div><span class="ds-badge" data-state="error"></span><div class="row">Info</div><span class="ds-badge" data-state="info"></span><div class="row">Done</div><span class="ds-badge" data-state="done"></span><div class="row">Counter</div><span class="ds-badge" data-state="counter">9</span></div></section><script>let n=9;const live=document.getElementById('live');function sync(){if(live.dataset.state==='counter')live.textContent=n}plus.onclick=()=>{n++;live.dataset.state='counter';sync()};minus.onclick=()=>{n=Math.max(0,n-1);live.dataset.state='counter';sync()};document.querySelectorAll('[data-state-btn]').forEach(b=>b.onclick=()=>{live.dataset.state=b.dataset.stateBtn;live.textContent=b.dataset.stateBtn==='counter'?n:''});document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>document.documentElement.dataset.theme=b.dataset.t)</script></body></html>
