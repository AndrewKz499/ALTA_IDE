<!doctype html><html lang="ru" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../../assets/fonts/fonts.css"><link rel="stylesheet" href="../../tokens/tokens.css"><link rel="stylesheet" href="./tool-bar.css"><title>Tool Bar</title></head><body><div class="ds-toolbar " role="toolbar"><button type="button" aria-pressed="true" title="Tool 1">↶</button><button type="button" aria-pressed="false" title="Tool 2">↷</button><button type="button" aria-pressed="false" title="Tool 3">▶</button><button type="button" aria-pressed="false" title="Tool 4">■</button><button type="button" aria-pressed="false" title="Tool 5">⚙</button><button type="button" aria-pressed="false" title="Tool 6">⋮</button></div><script>document.querySelectorAll('.interactive .ds-toolbar button').forEach(function(b){b.addEventListener('click',function(){if(!b.disabled)b.setAttribute('aria-pressed',String(b.getAttribute('aria-pressed')!=='true'))})});</script></body></html>
