<!doctype html><html lang="ru" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dropdown Preview — AltaIDE DS</title><link rel="stylesheet" href="../../assets/fonts/fonts.css"><link rel="stylesheet" href="../../tokens/tokens.css"><link rel="stylesheet" href="./dropdown.css"><style>*{box-sizing:border-box}body{margin:0;padding:24px;font-family:var(--font-family-rubik),sans-serif}html[data-theme=dark] body{background:var(--color-dark-gray-15);color:var(--color-dark-gray-4)}html[data-theme=light] body{background:var(--color-light-gray-1);color:var(--color-light-gray-12)}header{display:flex;justify-content:space-between;margin-bottom:28px}h1,h2{margin:0}.interactive{margin:16px 0 36px}.separator{border:0;border-top:1px solid currentColor;opacity:.5;margin:24px 0}.wrap{overflow:auto}.matrix{display:grid;grid-template-columns:150px 248px 162px;gap:14px 28px;align-items:start;min-width:650px}.row{text-align:right;padding-top:7px;opacity:.7;font-size:11px;text-transform:uppercase}.head{font-size:11px;text-transform:uppercase}.demo .ds-dropdown__menu{display:none}.demo[data-demo=hover] .ds-dropdown__control{border-color:var(--dropdown-border-hover)}.demo[data-demo=focused] .ds-dropdown__control,.demo[data-demo=focusedfilled] .ds-dropdown__control{border-color:var(--dropdown-border-focused)}.demo[data-demo=hoverfilled] .ds-dropdown__control{border-color:var(--dropdown-border-hover-filled);color:var(--dropdown-content-hover-filled)}.demo[data-demo=invalid],.demo[data-demo=hover_invalid],.demo[data-demo=focused_invalid]{--demo-invalid:1}.demo[data-demo=invalid] .ds-dropdown__control,.demo[data-demo=hover_invalid] .ds-dropdown__control,.demo[data-demo=focused_invalid] .ds-dropdown__control{border-color:var(--dropdown-border-invalid);color:var(--dropdown-content-invalid)}</style></head><body><header><div><h1>Dropdown</h1><small>AltaIDE/Dropdown · Figma 185521:27721 · L / M</small></div><div><button data-t="light">Light</button><button data-t="dark">Dark</button></div></header><section><h2>Interactive component</h2><div class="interactive"><div class="ds-dropdown" data-size="l" data-interactive="true" data-open="false"><button class="ds-dropdown__control" type="button" aria-haspopup="listbox" aria-expanded="false"><span class="ds-dropdown__value">Text</span><span class="ds-dropdown__arrow"></span></button><span class="ds-dropdown__hint">Hint text</span><div class="ds-dropdown__menu" role="listbox" hidden><button class="ds-dropdown__option" role="option">One</button><button class="ds-dropdown__option" role="option">Two</button><button class="ds-dropdown__option" role="option">Three</button><button class="ds-dropdown__option" role="option">Four</button><button class="ds-dropdown__option" role="option">Five</button></div></div></div></section><hr class="separator"><section><h2>States matrix</h2><div class="wrap"><div class="matrix" id="matrix"></div></div></section><script src="./dropdown.js"></script><script>(function(){var states=['Default','Selected','Hover','HoverFilled','Focused','FocusedFilled','Invalid','Hover_Invalid','Focused_Invalid','Loading','Disable'];function cell(size,state){var filled=['Selected','HoverFilled','FocusedFilled','Invalid','Hover_Invalid','Focused_Invalid'].indexOf(state)>-1;var s=state.toLowerCase().replace('_','_');var attrs=' data-size="'+size+'" data-demo="'+s+'" class="ds-dropdown demo"';if(filled)attrs+=' data-filled="true"';if(state.indexOf('Invalid')>-1)attrs+=' data-invalid="true"';if(state==='Loading')attrs+=' data-state="loading"';if(state==='Disable')attrs+=' data-state="disable"';return '<div'+attrs+'><button class="ds-dropdown__control" type="button"><span class="ds-dropdown__value">Text</span><span class="ds-dropdown__arrow"></span></button><span class="ds-dropdown__hint">Hint text</span></div>'}var h='<div></div><div class="head">Size L · 248</div><div class="head">Size M · 162</div>';states.forEach(function(s){h+='<div class="row">'+s+'</div>'+cell('l',s)+cell('m',s)});document.getElementById('matrix').innerHTML=h;document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>document.documentElement.dataset.theme=b.dataset.t)})();</script></body></html>
