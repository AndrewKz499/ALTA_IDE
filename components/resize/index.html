<!doctype html><html lang="ru" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../../assets/fonts/fonts.css"><link rel="stylesheet" href="../../tokens/tokens.css"><link rel="stylesheet" href="./resize.css"><title>Resize</title></head><body><div class="resize-layout"><div class="resize-pane" style="width:220px">Sidebar</div><div class="ds-resize" role="separator" tabindex="0" aria-orientation="vertical" aria-valuenow="220"></div><div class="resize-pane resize-main">Editor</div></div><script>var sep=document.querySelector('.interactive .ds-resize'),pane=document.querySelector('.interactive .resize-pane');if(sep&&pane){var drag=false;sep.addEventListener('pointerdown',function(e){drag=true;sep.setPointerCapture(e.pointerId)});sep.addEventListener('pointermove',function(e){if(!drag)return;var r=sep.parentNode.getBoundingClientRect(),w=Math.max(120,Math.min(360,e.clientX-r.left));pane.style.width=w+'px';sep.setAttribute('aria-valuenow',w)});sep.addEventListener('pointerup',function(){drag=false});sep.addEventListener('keydown',function(e){if(e.key==='ArrowLeft'||e.key==='ArrowRight'){var w=parseInt(pane.style.width||'220',10)+(e.key==='ArrowRight'?10:-10);w=Math.max(120,Math.min(360,w));pane.style.width=w+'px';sep.setAttribute('aria-valuenow',w)}})}</script></body></html>
