<!doctype html><html lang="ru" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resize Preview — AltaIDE DS</title><link rel="stylesheet" href="../../assets/fonts/fonts.css"><link rel="stylesheet" href="../../tokens/tokens.css"><link rel="stylesheet" href="./resize.css"><style>*{box-sizing:border-box}body{margin:0;padding:24px;font-family:var(--font-family-rubik),Rubik,sans-serif}html[data-theme="dark"] body{background:var(--color-dark-gray-15,#202124);color:var(--color-dark-white,#fff)}html[data-theme="light"] body{background:var(--color-light-gray-1,#f7f8fa);color:var(--color-light-gray-12,#202124)}.head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:28px}h1{margin:0;font-size:22px;line-height:28px}.meta,.note{margin:3px 0 0;font-size:12px;line-height:16px;opacity:.72}.theme{display:flex;padding:3px;border:1px solid currentColor;border-radius:6px}.theme button{border:0;background:transparent;color:inherit;padding:6px 10px;border-radius:4px}.theme button[aria-pressed="true"]{outline:2px solid currentColor;outline-offset:-2px}h2{font-size:16px;margin:0 0 6px}.interactive{margin-bottom:32px}.interactive-body{margin-top:16px}hr{border:0;border-top:1px solid currentColor;opacity:.4;margin:0 0 24px}.state-grid{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}.state-row{display:grid;grid-template-columns:170px 1fr;gap:18px;align-items:center;margin:12px 0}.state-row>span{font-size:11px;text-transform:uppercase;opacity:.7}.demo-button{min-height:28px;padding:0 10px;border:1px solid var(--color-dark-gray-9,#7d8394);border-radius:4px;background:var(--color-dark-gray-13,#2e3136);color:inherit}.demo-result{margin-top:8px;font-size:12px;opacity:.72}</style></head><body><header class="head"><div><h1>Resize</h1><p class="meta">AltaIDE DS · components/resize/</p></div><div class="theme" aria-label="Тема"><button data-theme-set="light" aria-pressed="false">Light</button><button data-theme-set="dark" aria-pressed="true">Dark</button></div></header><section class="interactive"><h2>Interactive component</h2><p class="note">Сначала проверьте реальное поведение компонента.</p><div class="interactive-body"><div class="resize-layout"><div class="resize-pane" style="width:220px">Sidebar</div><div class="ds-resize" role="separator" tabindex="0" aria-orientation="vertical" aria-valuenow="220"></div><div class="resize-pane resize-main">Editor</div></div></div></section><hr><section><h2>States matrix</h2><p class="note">Ключевые варианты и состояния для визуальной проверки.</p><div style="margin-top:16px"><div class="state-grid"><div class="ds-resize is-static"></div><div class="ds-resize is-static is-hover"></div></div></div></section><script>document.querySelectorAll('[data-theme-set]').forEach(function(b){b.addEventListener('click',function(){var t=b.dataset.themeSet;document.documentElement.dataset.theme=t;document.querySelectorAll('[data-theme-set]').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))})})});var sep=document.querySelector('.interactive .ds-resize'),pane=document.querySelector('.interactive .resize-pane');if(sep&&pane){var drag=false;sep.addEventListener('pointerdown',function(e){drag=true;sep.setPointerCapture(e.pointerId)});sep.addEventListener('pointermove',function(e){if(!drag)return;var r=sep.parentNode.getBoundingClientRect(),w=Math.max(120,Math.min(360,e.clientX-r.left));pane.style.width=w+'px';sep.setAttribute('aria-valuenow',w)});sep.addEventListener('pointerup',function(){drag=false});sep.addEventListener('keydown',function(e){if(e.key==='ArrowLeft'||e.key==='ArrowRight'){var w=parseInt(pane.style.width||'220',10)+(e.key==='ArrowRight'?10:-10);w=Math.max(120,Math.min(360,w));pane.style.width=w+'px';sep.setAttribute('aria-valuenow',w)}})}</script></body></html>
