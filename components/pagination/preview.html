<!doctype html><html lang="ru" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pagination Preview — AltaIDE DS</title><link rel="stylesheet" href="../../assets/fonts/fonts.css"><link rel="stylesheet" href="../../tokens/tokens.css"><link rel="stylesheet" href="./pagination.css"><style>*{box-sizing:border-box}body{margin:0;padding:24px;font-family:var(--font-family-rubik),Rubik,sans-serif}html[data-theme="dark"] body{background:var(--color-dark-gray-15,#202124);color:var(--color-dark-white,#fff)}html[data-theme="light"] body{background:var(--color-light-gray-1,#f7f8fa);color:var(--color-light-gray-12,#202124)}.head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:28px}h1{margin:0;font-size:22px;line-height:28px}.meta,.note{margin:3px 0 0;font-size:12px;line-height:16px;opacity:.72}.theme{display:flex;padding:3px;border:1px solid currentColor;border-radius:6px}.theme button{border:0;background:transparent;color:inherit;padding:6px 10px;border-radius:4px}.theme button[aria-pressed="true"]{outline:2px solid currentColor;outline-offset:-2px}h2{font-size:16px;margin:0 0 6px}.interactive{margin-bottom:32px}.interactive-body{margin-top:16px}hr{border:0;border-top:1px solid currentColor;opacity:.4;margin:0 0 24px}.state-grid{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}.state-row{display:grid;grid-template-columns:170px 1fr;gap:18px;align-items:center;margin:12px 0}.state-row>span{font-size:11px;text-transform:uppercase;opacity:.7}.demo-button{min-height:28px;padding:0 10px;border:1px solid var(--color-dark-gray-9,#7d8394);border-radius:4px;background:var(--color-dark-gray-13,#2e3136);color:inherit}.demo-result{margin-top:8px;font-size:12px;opacity:.72}</style></head><body><header class="head"><div><h1>Pagination</h1><p class="meta">AltaIDE DS · components/pagination/</p></div><div class="theme" aria-label="Тема"><button data-theme-set="light" aria-pressed="false">Light</button><button data-theme-set="dark" aria-pressed="true">Dark</button></div></header><section class="interactive"><h2>Interactive component</h2><p class="note">Сначала проверьте реальное поведение компонента.</p><div class="interactive-body"><nav class="ds-pagination" aria-label="Pagination"><button data-delta="-1">‹</button><button aria-current="page">1</button><button>2</button><button>3</button><button data-delta="1">›</button></nav><output class="demo-result">Страница 1</output></div></section><hr><section><h2>States matrix</h2><p class="note">Ключевые варианты и состояния для визуальной проверки.</p><div style="margin-top:16px"><div class="state-row"><span>Default / Hover / Pressed / Disable</span><nav class="ds-pagination"><button>1</button><button class="is-hover">2</button><button class="is-pressed">3</button><button disabled>4</button></nav></div></div></section><script>document.querySelectorAll('[data-theme-set]').forEach(function(b){b.addEventListener('click',function(){var t=b.dataset.themeSet;document.documentElement.dataset.theme=t;document.querySelectorAll('[data-theme-set]').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))})})});var nav=document.querySelector('.interactive .ds-pagination'),out=document.querySelector('.interactive+.demo-result,.demo-result');if(nav){nav.addEventListener('click',function(e){if(e.target.tagName!=='BUTTON')return;var n=parseInt((nav.querySelector('[aria-current="page"]')||{}).textContent||'1',10),d=parseInt(e.target.dataset.delta||'0',10);if(d)n=Math.max(1,Math.min(3,n+d));else if(/^\d+$/.test(e.target.textContent))n=parseInt(e.target.textContent,10);nav.querySelectorAll('button').forEach(function(b){b.removeAttribute('aria-current');if(b.textContent==String(n))b.setAttribute('aria-current','page')});if(out)out.textContent='Страница '+n})}</script></body></html>
