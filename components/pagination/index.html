<!doctype html><html lang="ru" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../../assets/fonts/fonts.css"><link rel="stylesheet" href="../../tokens/tokens.css"><link rel="stylesheet" href="./pagination.css"><title>Pagination</title></head><body><nav class="ds-pagination" aria-label="Pagination"><button data-delta="-1">‹</button><button aria-current="page">1</button><button>2</button><button>3</button><button data-delta="1">›</button></nav><output class="demo-result">Страница 1</output><script>var nav=document.querySelector('.interactive .ds-pagination'),out=document.querySelector('.interactive+.demo-result,.demo-result');if(nav){nav.addEventListener('click',function(e){if(e.target.tagName!=='BUTTON')return;var n=parseInt((nav.querySelector('[aria-current="page"]')||{}).textContent||'1',10),d=parseInt(e.target.dataset.delta||'0',10);if(d)n=Math.max(1,Math.min(3,n+d));else if(/^\d+$/.test(e.target.textContent))n=parseInt(e.target.textContent,10);nav.querySelectorAll('button').forEach(function(b){b.removeAttribute('aria-current');if(b.textContent==String(n))b.setAttribute('aria-current','page')});if(out)out.textContent='Страница '+n})}</script></body></html>
