<!doctype html><html lang="ru" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../../assets/fonts/fonts.css"><link rel="stylesheet" href="../../tokens/tokens.css"><link rel="stylesheet" href="./menu-bar.css"><title>Menu Bar</title></head><body><nav class="ds-menu-bar" aria-label="Main menu"><button>Файл</button><button>Правка</button><button>Вид</button><button>Библиотеки</button><button>Компиляция</button><button>Онлайн</button><button>Отладка</button><div class="menu-popup" hidden><button>Новый проект</button><button>Открыть…</button><button>Сохранить</button></div></nav><script>var m=document.querySelector('.interactive .ds-menu-bar'),p=m&&m.querySelector('.menu-popup'),f=m&&m.querySelector('button');if(f&&p){f.addEventListener('click',function(){p.hidden=!p.hidden;f.classList.toggle('is-active',!p.hidden)});document.addEventListener('keydown',function(e){if(e.key==='Escape'){p.hidden=true;f.classList.remove('is-active')}})}</script></body></html>
