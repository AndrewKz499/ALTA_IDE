<!doctype html><html lang="ru" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../../assets/fonts/fonts.css"><link rel="stylesheet" href="../../tokens/tokens.css"><link rel="stylesheet" href="./segmented-control.css"><title>Segmented Control</title></head><body><div class="ds-segmented" role="group" aria-label="View"><button aria-pressed="true">Проект</button><button aria-pressed="false">Визуализация</button><button aria-pressed="false">Онлайн</button></div><script>document.querySelectorAll('.ds-segmented').forEach(function(g){g.querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){g.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed','false')});b.setAttribute('aria-pressed','true')})})});</script></body></html>
