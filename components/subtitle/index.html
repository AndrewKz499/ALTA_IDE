<!doctype html><html lang="ru" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../../assets/fonts/fonts.css"><link rel="stylesheet" href="../../tokens/tokens.css"><link rel="stylesheet" href="./subtitle.css"><title>Subtitle</title></head><body><div class="ds-subtitle"><div><span>Раздел</span><b>Настройки интерфейса</b></div><button type="button" aria-expanded="true">⌃</button></div><div class="subtitle-content">Содержимое раздела</div><script>var b=document.querySelector('.interactive .ds-subtitle button'),c=document.querySelector('.interactive .subtitle-content');if(b&&c)b.addEventListener('click',function(){var open=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',String(!open));b.textContent=open?'⌄':'⌃';c.hidden=open});</script></body></html>
