<!doctype html><html lang="ru" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../../assets/fonts/fonts.css"><link rel="stylesheet" href="../../tokens/tokens.css"><link rel="stylesheet" href="./spinner.css"><title>Spinner</title></head><body><div class="ds-spinner" role="status" aria-label="Загрузка"></div><button class="demo-button spinner-toggle" type="button">Пауза</button><script>var s=document.querySelector('.interactive .ds-spinner'),b=document.querySelector('.interactive .spinner-toggle');if(s&&b)b.addEventListener('click',function(){s.classList.toggle('is-paused');b.textContent=s.classList.contains('is-paused')?'Продолжить':'Пауза'});</script></body></html>
