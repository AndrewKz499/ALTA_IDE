<!doctype html><html lang="ru" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../../assets/fonts/fonts.css"><link rel="stylesheet" href="../../tokens/tokens.css"><link rel="stylesheet" href="./progress-bar.css"><title>Progress Bar</title></head><body><div class="ds-progress"><div class="ds-progress__track"><span style="width:35%"></span></div><output>35%</output></div><input class="demo-range" type="range" min="0" max="100" value="35"><script>var r=document.querySelector('.demo-range'),p=document.querySelector('.interactive .ds-progress');if(r&&p)r.addEventListener('input',function(){p.querySelector('span').style.width=r.value+'%';p.querySelector('output').textContent=r.value+'%'});</script></body></html>
