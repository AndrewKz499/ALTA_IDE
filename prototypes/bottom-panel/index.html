<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bottom Panel Prototype — AltaIDE</title>
  <link rel="stylesheet" href="../../assets/fonts/fonts.css">
  <link rel="stylesheet" href="../../tokens/tokens.css">
  <link rel="stylesheet" href="../../components/button/button.css">
  <link rel="stylesheet" href="../../components/tabs/tabs.css">
  <link rel="stylesheet" href="../../components/badge/badge.css">
  <link rel="stylesheet" href="../../components/tabs-content/tabs-content.css">
  <link rel="stylesheet" href="./bottom-panel.css">
</head>
<body>
  <main class="prototype-shell">
    <header class="prototype-toolbar">
      <div class="prototype-title">
        <strong>Bottom Panel — Анализатор</strong>
        <span>Прототип по Figma node 203662:23908 · собран только из существующих AltaIDE DS компонентов</span>
      </div>
      <div class="theme-switch" aria-label="Переключение темы">
        <button class="ds-button" type="button" data-size="m" data-icon="none" data-theme-set="light" aria-pressed="false">
          <span class="ds-button__label">Light</span>
        </button>
        <button class="ds-button" type="button" data-size="m" data-icon="none" data-theme-set="dark" aria-pressed="true">
          <span class="ds-button__label">Dark</span>
        </button>
      </div>
    </header>

    <section class="bottom-panel-stage" aria-label="Область прототипа">
      <section class="bottom-panel" aria-label="Нижняя панель IDE">
        <div class="panel-tabs">
          <div class="ds-tabs" role="tablist" aria-label="Вкладки нижней панели">
            <button type="button" role="tab" aria-selected="true">Анализатор</button>
          </div>
        </div>

        <div class="filter-row" aria-label="Фильтр сообщений">
          <div class="status-group">
            <span class="status-chip" title="Ошибки">
              <span class="ds-badge" data-state="error" aria-hidden="true"></span>
              <span>0</span>
            </span>
            <span class="status-chip" title="Предупреждения">
              <span class="ds-badge" data-state="counter">0</span>
            </span>
            <span class="status-chip" title="Информация">
              <span class="ds-badge" data-state="info" aria-hidden="true"></span>
              <span>0</span>
            </span>
          </div>
          <div class="filter-actions">
            <button type="button" aria-label="Дополнительные действия" title="Дополнительные действия">⋮</button>
          </div>
        </div>

        <div class="panel-body">
          <section class="ds-tabs-content" aria-label="Содержимое анализатора">
            <div class="ds-tabs-content__body">
              <div class="empty-state">Ошибок и сообщений нет</div>
            </div>
          </section>
        </div>
      </section>
    </section>
  </main>

  <div class="prototype-note">Вертикальная панель иконок из Figma не добавлена: отдельного соответствующего компонента в текущем GitHub DS нет.</div>

  <script>
    (function () {
      var buttons = document.querySelectorAll('[data-theme-set]');
      buttons.forEach(function (button) {
        button.addEventListener('click', function () {
          var theme = button.getAttribute('data-theme-set');
          document.documentElement.dataset.theme = theme;
          buttons.forEach(function (item) {
            item.setAttribute('aria-pressed', String(item === button));
          });
        });
      });
    })();
  </script>
</body>
</html>
