<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AltaIDE — Compute Function Prototype</title></head><body>

<script>
(async()=>{try{const binary=atob(window.__ALTA_PAYLOAD||'');const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close();}catch(error){document.body.textContent='Не удалось открыть прототип: '+error.message;console.error(error);}})();
</script></body></html>
